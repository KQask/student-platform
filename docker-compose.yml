services:
  postgres:
    image: postgres:16-alpine
    container_name: student-platform-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: student
      POSTGRES_PASSWORD: student
      POSTGRES_DB: student_platform
    volumes:
      - student_platform_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U student -d student_platform"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: student-platform-app
    restart: unless-stopped
    env_file: .env
    environment:
      # Overrides DATABASE_URL from .env to use Docker-internal hostname
      DATABASE_URL: postgresql://student:student@postgres:5432/student_platform?schema=public
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  webhook:
    image: node:20-alpine
    container_name: student-platform-webhook
    restart: unless-stopped
    working_dir: /app
    command: node webhook.js
    environment:
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      WEBHOOK_PORT: 9000
      PROJECT_DIR: /project
    volumes:
      - ./webhook.js:/app/webhook.js:ro
      - /root/student-platform:/project
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "127.0.0.1:9000:9000"

volumes:
  student_platform_pgdata:
